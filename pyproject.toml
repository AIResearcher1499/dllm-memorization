[project]
name = "dlmmem"
version = "0.1.0"
description = "Memorization capacity of masked diffusion LMs (G0-B)"
readme = "README.md"
# Same window as fertility-precision / kv-allocation; see kv-allocation's
# pyproject for the rationale on pinning and on torch living in base deps.
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.5",
]

[project.scripts]
dlmmem = "dlmmem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlmmem"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
